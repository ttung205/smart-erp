# Vai trò máy A (AZ thứ nhất) trong chế độ HA. Dùng sau docker-compose.ha.yml (xem hướng dẫn ở đầu file đó).
# Máy A chạy trọn bộ ứng dụng và CÒN gánh các thành phần chỉ được phép chạy một bản:
#   - RabbitMQ và Mongo (một node, là điểm lỗi đơn còn lại, đã ghi trong tài liệu chịu lỗi)
#   - relay outbox (catalog, sales, eoffice) và sales-scheduler: relay Laravel không khóa nên chạy hai nơi sẽ phát trùng event
#   - chat-service và notification-service: trạng thái kết nối realtime nằm trong bộ nhớ từng process
#   - sao lưu (profile ops) và giám sát (profile monitoring, đặt COMPOSE_PROFILES=monitoring trong .env của máy A).
#     Loki, Prometheus, Grafana chỉ ở máy A; Alloy chạy ở mọi máy và đẩy log về Loki của máy A (cổng 3100).
# Máy B phải gọi được RabbitMQ của máy A, nên cổng 5672 được publish ra máy chủ (security group chỉ cho nhóm sg-app).
# Grafana publish cổng 3000 để ALB chuyển /grafana vào đúng máy này (security group chỉ cho sg-alb).

services:
  rabbitmq:
    ports: !override
      - "5672:5672"
  grafana:
    ports: !override
      - "3000:3000"
  # Loki nhận log từ Alloy của các máy ASG qua cổng 3100 (security group erp-app chỉ cho chính nhóm erp-app, KHÔNG ra Internet).
  loki:
    ports: !override
      - "3100:3100"

  # Tệp chat nằm trên EFS (không còn là docker volume chat_files). create_host_path: false để thiếu EFS thì không khởi động.
  chat-service:
    volumes: !override
      - type: bind
        source: ${CHAT_FILES_DIR:-/mnt/efs/chat}
        target: /app/chat-files
        bind:
          create_host_path: false

  # MySQL ở RDS nên sao lưu/phục hồi không chờ container mysql. Phục hồi dùng tài khoản quản trị RDS:
  # đặt MYSQL_ROOT_USER=admin và MYSQL_ROOT_PASSWORD=<mật khẩu quản trị RDS> trong .env của máy A.
  # Sao lưu đọc tệp chat và các thư mục EFS khác (backup.sh đọc /data/chat_files và /data/efs, chỉ đọc); phục hồi ghi ngược vào đúng thư mục đó.
  backup:
    volumes: !override
      - ${BACKUP_DIR:-./backups}:/backups
      - type: bind
        source: ${CHAT_FILES_DIR:-/mnt/efs/chat}
        target: /data/chat_files
        read_only: true
        bind:
          create_host_path: false
      # Cả EFS (chỉ đọc): backup.sh gói mỗi thư mục con (sales, purchase, eoffice) thành files/efs_<tên>.tar.gz; bỏ qua chat vì đã gói riêng
      - type: bind
        source: ${EFS_ROOT_DIR:-/mnt/efs}
        target: /data/efs
        read_only: true
        bind:
          create_host_path: false
    depends_on: !override
      mongo:
        condition: service_healthy
  recovery:
    volumes: !override
      - ${BACKUP_DIR:-./backups}:/backups
      - type: bind
        source: ${CHAT_FILES_DIR:-/mnt/efs/chat}
        target: /data/chat_files
        bind:
          create_host_path: false
      - type: bind
        source: ${EFS_ROOT_DIR:-/mnt/efs}
        target: /data/efs
        bind:
          create_host_path: false
    depends_on: !override
      mongo:
        condition: service_healthy
