[www]
listen = 127.0.0.1:9000

; Giữ biến môi trường do docker compose truyền vào (mặc định FPM xóa sạch chúng).
clear_env = no

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
