name: Build images

# Build image của từng service và đẩy lên GitHub Container Registry (ghcr.io).
# Máy chủ chỉ việc `docker compose pull`, không build trên EC2 (8 GB RAM không đủ để build cả hệ thống).
#   - push vào main: build và đẩy, gắn thẻ sha-<7 ký tự> (để quay lui theo từng commit) và latest.
#   - pull request sửa chính workflow này: chỉ build thử, không đẩy.
#   - chạy tay (workflow_dispatch): build và đẩy.
on:
  push:
    branches: [main]
    # Chỉ sửa tài liệu thì không build lại image và không kích hoạt deploy (Deploy production chạy sau workflow này).
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths:
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: smart-erp-identity-service, context: services/identity-service }
          - { image: smart-erp-catalog-service, context: services/catalog-service }
          - { image: smart-erp-sales-service, context: services/sales-service }
          - { image: smart-erp-eoffice-service, context: services/eoffice-service }
          - { image: smart-erp-finance-service, context: services/finance-service }
          - { image: smart-erp-purchase-service, context: services/purchase-service }
          - { image: smart-erp-inventory-service, context: services/inventory-service }
          - { image: smart-erp-chat-service, context: services/chat-service }
          - { image: smart-erp-notification-service, context: services/notification-service }
          - { image: smart-erp-ai-service, context: services/ai-service }
          - { image: smart-erp-frontend, context: frontend }
          - { image: smart-erp-backup, context: infrastructure/backup }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tên và thẻ image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Không đặt target: lấy stage cuối của Dockerfile, tức `runtime` (stage `test` không bao giờ được đẩy lên)
      - name: Build và đẩy
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
