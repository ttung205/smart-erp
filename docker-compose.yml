services:
  # =========================================================================
  # 1. HẠ TẦNG CỐT LÕI (INFRASTRUCTURE)
  # =========================================================================

  # Multi-Database MySQL 8.0 (8 isolated schemas theo nguyên tắc Database-per-service)
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker với Management Dashboard UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    # RabbitMQ lưu dữ liệu theo tên node (rabbit@<hostname>). Hostname cố định để recreate container không tạo node trống.
    # Giá trị là hostname của node đang giữ dữ liệu trong volume rabbitmq_data; môi trường mới đặt tên nào cũng được.
    hostname: 704c693c923e
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_secret}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP protocol
      - "127.0.0.1:15672:15672"   # Management Dashboard UI
    volumes:
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infrastructure/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB 7 cho chat-service và notification-service (dữ liệu dạng tài liệu, ghi nhiều).
  # Chạy replica set một node vì chat-service cần transaction; healthcheck tự khởi tạo replica set lần đầu.
  # Không bật xác thực: chỉ bind 127.0.0.1 ở dev và không publish ở production (xem docker-compose.prod.yml).
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # Mailpit Local SMTP Server & Web UI (Local Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: erp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"     # SMTP Port cho Notification Service
      - "${MAILPIT_UI_PORT:-8025}:8025"     # Web UI xem trước email & file đính kèm
    networks:
      - erp-network

  # =========================================================================
  # 2. MICROSERVICES BACKEND
  # =========================================================================

  # 2.1 Identity Service (Laravel 13 / PHP 8.3)
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    image: smart-erp-identity-service:latest
    container_name: erp-identity
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "Identity Service"
      APP_ENV: production
      APP_KEY: ${IDENTITY_APP_KEY:-base64:VFpnyI3eKcgG8lexKsNk2jHG/AgO+uEwhEYI4x3pLuU=}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_identity_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.2 Catalog Service (Laravel 13 / PHP 8.3)
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    image: smart-erp-catalog-service:latest
    container_name: erp-catalog
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "Catalog Service"
      APP_ENV: production
      APP_KEY: ${CATALOG_APP_KEY:-base64:euw8kQxu75uK2ZhGn53tDb6eKZOh+eroRkUdbWzOxi8=}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_catalog_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.2b Catalog Outbox Relay Worker
  catalog-relay:
    image: smart-erp-catalog-service:latest
    container_name: erp-catalog-relay
    restart: unless-stopped
    command: ["php", "artisan", "outbox:relay"]
    environment:
      APP_ENV: production
      APP_KEY: ${CATALOG_APP_KEY:-base64:euw8kQxu75uK2ZhGn53tDb6eKZOh+eroRkUdbWzOxi8=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_catalog_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
    depends_on:
      catalog-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network

  # 2.3 Purchase Service (ASP.NET Core / .NET 10)
  purchase-service:
    build:
      context: ./services/purchase-service
      dockerfile: Dockerfile
    image: smart-erp-purchase-service:latest
    container_name: erp-purchase
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8003"
      DatabaseProvider: MySql
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=erp_purchase_db;User=erp_user;Password=${MYSQL_PASSWORD:-erp_secret};TreatTinyAsBoolean=true;"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER:-erp_rabbit}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RabbitMQ__ExchangeName: erp.events
      Jwt__Secret: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      Services__InternalKey: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8003/api/v1/purchase/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.4 Inventory Service (ASP.NET Core / .NET 10)
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    image: smart-erp-inventory-service:latest
    container_name: erp-inventory
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8004"
      DatabaseProvider: MySql
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=erp_inventory_db;User=erp_user;Password=${MYSQL_PASSWORD:-erp_secret};"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER:-erp_rabbit}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RabbitMQ__ExchangeName: erp.events
      Jwt__Secret: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8004/api/v1/inventory/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.5 Sales Service (Laravel 13 / PHP 8.3)
  sales-service:
    build:
      context: ./services/sales-service
      dockerfile: Dockerfile
    image: smart-erp-sales-service:latest
    container_name: erp-sales
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      APP_NAME: "Sales Service"
      APP_ENV: production
      APP_KEY: ${SALES_APP_KEY:-base64:YQ3WeaKMGlYTZX19my0YQLtZHLp33997iRpj5YdjY7Y=}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_sales_db
      # Trạng thái circuit breaker (Sales chưa có bảng cache trong MySQL; chỉ cần sống trong container)
      CACHE_STORE: file
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
      CATALOG_SERVICE_URL: http://catalog-service:8002
      IDENTITY_SERVICE_URL: http://identity-service:8001
      INVENTORY_SERVICE_URL: http://inventory-service:8004
      FINANCE_SERVICE_URL: http://finance-service:8008
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8005/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.5b Sales Outbox Relay Worker
  sales-relay:
    image: smart-erp-sales-service:latest
    container_name: erp-sales-relay
    restart: unless-stopped
    command: ["php", "artisan", "outbox:relay"]
    environment:
      APP_ENV: production
      APP_KEY: ${SALES_APP_KEY:-base64:YQ3WeaKMGlYTZX19my0YQLtZHLp33997iRpj5YdjY7Y=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_sales_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
    depends_on:
      sales-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network

  # 2.6 Notification Service (Node.js 22 Express & Socket.IO)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    image: smart-erp-notification-service:latest
    container_name: erp-notification
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      NODE_ENV: production
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM_ADDRESS: sales@thanhtung.vn
      MAIL_FROM_NAME: "Smart ERP"
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      IDENTITY_SERVICE_URL: http://identity-service:8001
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_rabbit}:${RABBITMQ_PASSWORD:-rabbit_secret}@rabbitmq:5672
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      NOTIFICATION_DB_NAME: erp_notification_db
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.7 E-Office Service (Laravel 13 / PHP 8.3)
  eoffice-service:
    build:
      context: ./services/eoffice-service
      dockerfile: Dockerfile
    image: smart-erp-eoffice-service:latest
    container_name: erp-eoffice
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      APP_NAME: "EOffice Service"
      APP_ENV: production
      APP_KEY: ${EOFFICE_APP_KEY:-base64:jHXlSUdhe4qBaRcDvaryub9jekkytDbPeoKhhcLP/TM=}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_eoffice_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      IDENTITY_SERVICE_URL: http://identity-service:8001
      FINANCE_SERVICE_URL: http://finance-service:8008
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8007/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.7b E-Office Outbox Relay Worker
  eoffice-relay:
    image: smart-erp-eoffice-service:latest
    container_name: erp-eoffice-relay
    restart: unless-stopped
    command: ["php", "artisan", "outbox:relay"]
    environment:
      APP_ENV: production
      APP_KEY: ${EOFFICE_APP_KEY:-base64:jHXlSUdhe4qBaRcDvaryub9jekkytDbPeoKhhcLP/TM=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_eoffice_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_secret}
      RABBITMQ_EXCHANGE: erp.events
    depends_on:
      eoffice-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - erp-network

  # 2.8 Finance Service (Laravel 13 / PHP 8.3)
  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    image: smart-erp-finance-service:latest
    container_name: erp-finance
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      APP_NAME: "Finance Service"
      APP_ENV: production
      APP_KEY: ${FINANCE_APP_KEY:-base64:DAaj+IsuNHmTL6+d5VrR8I0y8D7Xvno1pi8LhmKgR4E=}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: erp_finance_db
      DB_USERNAME: erp_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
      AUTO_SEED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8008/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.9 Chat Service (ASP.NET Core / .NET 10 + SignalR)
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    image: smart-erp-chat-service:latest
    container_name: erp-chat
    restart: unless-stopped
    ports:
      - "8009:8009"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8009"
      ConnectionStrings__ChatMongoConnection: "mongodb://mongo:27017/?replicaSet=rs0"
      Mongo__Database: erp_chat_db
      Storage__Root: "/app/chat-files"
      Jwt__Secret: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      Services__Identity: "http://identity-service:8001"
      Services__InternalKey: ${INTERNAL_SERVICE_KEY:-smart_erp_internal_2026}
    volumes:
      - chat_files:/app/chat-files
    depends_on:
      mongo:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8009/api/v1/chat/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # 2.10 AI & Analytics Service (Python 3.12 / FastAPI)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: smart-erp-ai-service:latest
    container_name: erp-ai
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      AI_SERVICE_PORT: 8010
      JWT_SECRET: ${JWT_SECRET:-smart_erp_super_secure_jwt_secret_key_2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: "openai/gpt-oss-120b"
      SYNC_INTERVAL_SECONDS: 300
      # Mặc định TẮT: ETL đọc thẳng schema của các service khác (xem docs/deployment.md). Bật cho demo: AI_WAREHOUSE_SYNC_ENABLED=true
      WAREHOUSE_SYNC_ENABLED: ${AI_WAREHOUSE_SYNC_ENABLED:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_secret}
      ANALYTICS_DB_NAME: erp_analytics_db
    depends_on:
      mysql:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - erp-network

  # =========================================================================
  # 3. KONG API GATEWAY (DB-less declarative configuration)
  # =========================================================================
  gateway:
    image: kong:3.9.1
    container_name: erp-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: 210m
      KONG_LOG_LEVEL: notice
      # Access log kèm correlation id và thời gian xử lý, để tìm một request trong Loki (dashboard Logs)
      KONG_NGINX_HTTP_LOG_FORMAT: "erp '$$remote_addr \"$$request\" $$status $${request_time}s upstream=$$upstream_addr correlation_id=$$http_x_correlation_id'"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout erp"
    ports:
      - "8000:8000"
    volumes:
      - ./infrastructure/kong/kong.yml:/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      purchase-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      sales-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      eoffice-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - erp-network

  # Rollback gateway: docker compose --profile legacy-gateway up -d gateway-legacy
  gateway-legacy:
    profiles: ["legacy-gateway"]
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: smart-erp-gateway:latest
    container_name: erp-gateway-legacy
    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - purchase-service
      - inventory-service
      - sales-service
      - notification-service
      - eoffice-service
      - finance-service
      - chat-service
      - ai-service
    networks:
      - erp-network

  # =========================================================================
  # 4. FRONTEND WEB APPLICATION (Vue 3 + PrimeVue)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: smart-erp-frontend:latest
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - erp-network

  # =========================================================================
  # 5. GIÁM SÁT (profile "monitoring"): docker compose --profile monitoring up -d
  # =========================================================================

  # Gom log mọi container
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.5.3
    container_name: erp-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infrastructure/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Đọc log stdout của container qua Docker API rồi đẩy vào Loki
  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.10.2
    container_name: erp-alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - erp-network

  # Metrics: Kong, RabbitMQ; luật cảnh báo trong alerts.yml
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: erp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Dashboard: ERP Overview, RabbitMQ, Logs (tự nạp từ infrastructure/monitoring/grafana)
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    container_name: erp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/erp-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - erp-network

# =========================================================================
# NETWORKS & VOLUMES
# =========================================================================
networks:
  erp-network:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
  mongo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  chat_files:
