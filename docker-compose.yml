services:
  # 1. Multi-Database MySQL 8.0 (7 isolated schemas)
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_secret
    ports:
      - "3306:3306"
    volumes:
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "erp_user", "-perp_secret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ Message Broker with Management UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: erp_rabbit
      RABBITMQ_DEFAULT_PASS: rabbit_secret
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Dashboard UI
    volumes:
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. NGINX API Gateway
  gateway:
    image: nginx:alpine
    container_name: erp-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - erp-network

  # 4. Mailpit Local SMTP Server & Web UI (Local Email Testing)
  mailpit:
    image: axllent/mailpit:latest
    container_name: erp-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"     # SMTP Port for Notification Service
      - "8025:8025"     # Web UI to preview sent emails & attachments
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
