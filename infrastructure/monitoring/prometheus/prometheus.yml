global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kong: request, mã trạng thái, độ trễ theo service (plugin prometheus, status listener :8100)
  - job_name: kong
    static_configs:
      - targets: ["gateway:8100"]

  # RabbitMQ: plugin rabbitmq_prometheus. /metrics/per-object để có số message từng queue (vd erp.dead_letters)
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  # CPU / RAM từng container
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Chỉ giữ container của docker-compose để giảm số series
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop
