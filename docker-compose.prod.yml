# Production override. Dùng cùng docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (hoặc scripts/deploy.ps1 -Production, tự kiểm tra cấu hình trước khi chạy)
#
# Khác biệt so với Development:
#   1. Mọi secret là BẮT BUỘC (${VAR:?}), giống docker-compose.yml - thiếu biến thì `docker compose config` báo lỗi. Khác ở chỗ
#      file này còn được scripts/validate-prod-config.ps1 kiểm tra độ dài và không cho dùng giá trị mẫu (change-me-*).
#   2. Chỉ gateway (8000) và frontend (5175) được publish ra host; các service/hạ tầng khác chỉ truy cập qua mạng Docker erp-network.
# Không đổi nghiệp vụ, API contract hay schema database.

x-mysql-password: &mysql-password ${MYSQL_PASSWORD:?MYSQL_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-rabbit-password: &rabbit-password ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-jwt-secret: &jwt-secret ${JWT_SECRET:?JWT_SECRET chưa đặt trong .env/môi trường (xem .env.example)}
x-internal-key: &internal-key ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY chưa đặt trong .env/môi trường (xem .env.example)}
x-identity-db-password: &identity-db-password ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-catalog-db-password: &catalog-db-password ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-purchase-db-password: &purchase-db-password ${PURCHASE_DB_PASSWORD:?PURCHASE_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-inventory-db-password: &inventory-db-password ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-sales-db-password: &sales-db-password ${SALES_DB_PASSWORD:?SALES_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-eoffice-db-password: &eoffice-db-password ${EOFFICE_DB_PASSWORD:?EOFFICE_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-finance-db-password: &finance-db-password ${FINANCE_DB_PASSWORD:?FINANCE_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-analytics-db-password: &analytics-db-password ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
x-backup-db-password: &backup-db-password ${BACKUP_DB_PASSWORD:?BACKUP_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}

services:
  mysql:
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
      MYSQL_PASSWORD: *mysql-password
      IDENTITY_DB_PASSWORD: *identity-db-password
      CATALOG_DB_PASSWORD: *catalog-db-password
      PURCHASE_DB_PASSWORD: *purchase-db-password
      INVENTORY_DB_PASSWORD: *inventory-db-password
      SALES_DB_PASSWORD: *sales-db-password
      EOFFICE_DB_PASSWORD: *eoffice-db-password
      FINANCE_DB_PASSWORD: *finance-db-password
      ANALYTICS_DB_PASSWORD: *analytics-db-password
      BACKUP_DB_PASSWORD: *backup-db-password
      # erp_user (test/công cụ dev) không có quyền trên dữ liệu thật ở Production
      MYSQL_DEV_TOOLS_ACCESS: "false"

  mongo:
    ports: !reset []

  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: *rabbit-password

  mailpit:
    ports: !reset []

  identity-service:
    ports: !reset []
    environment:
      APP_KEY: ${IDENTITY_APP_KEY:?IDENTITY_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *identity-db-password
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key

  catalog-service:
    ports: !reset []
    environment:
      APP_KEY: ${CATALOG_APP_KEY:?CATALOG_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *catalog-db-password
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key
      RABBITMQ_PASSWORD: *rabbit-password

  catalog-relay:
    environment:
      APP_KEY: ${CATALOG_APP_KEY:?CATALOG_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *catalog-db-password
      RABBITMQ_PASSWORD: *rabbit-password

  purchase-service:
    ports: !reset []
    environment:
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=erp_purchase_db;User=erp_purchase;Password=${PURCHASE_DB_PASSWORD:?PURCHASE_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)};TreatTinyAsBoolean=true;"
      RabbitMQ__Password: *rabbit-password
      Jwt__Secret: *jwt-secret
      Services__InternalKey: *internal-key

  inventory-service:
    ports: !reset []
    environment:
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=erp_inventory_db;User=erp_inventory;Password=${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)};"
      RabbitMQ__Password: *rabbit-password
      Jwt__Secret: *jwt-secret
      Services__InternalKey: *internal-key

  sales-service:
    ports: !reset []
    environment:
      APP_KEY: ${SALES_APP_KEY:?SALES_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *sales-db-password
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key
      RABBITMQ_PASSWORD: *rabbit-password

  sales-scheduler:
    environment:
      APP_KEY: ${SALES_APP_KEY:?SALES_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *sales-db-password
      INTERNAL_SERVICE_KEY: *internal-key

  sales-relay:
    environment:
      APP_KEY: ${SALES_APP_KEY:?SALES_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *sales-db-password
      RABBITMQ_PASSWORD: *rabbit-password

  notification-service:
    ports: !reset []
    environment:
      APP_ENV: production
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-erp_rabbit}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}@rabbitmq:5672

  eoffice-service:
    ports: !reset []
    environment:
      APP_KEY: ${EOFFICE_APP_KEY:?EOFFICE_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *eoffice-db-password
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key
      RABBITMQ_PASSWORD: *rabbit-password

  eoffice-relay:
    environment:
      APP_KEY: ${EOFFICE_APP_KEY:?EOFFICE_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *eoffice-db-password
      RABBITMQ_PASSWORD: *rabbit-password

  finance-service:
    ports: !reset []
    environment:
      APP_KEY: ${FINANCE_APP_KEY:?FINANCE_APP_KEY chưa đặt trong .env/môi trường (xem .env.example)}
      DB_PASSWORD: *finance-db-password
      JWT_SECRET: *jwt-secret
      INTERNAL_SERVICE_KEY: *internal-key

  chat-service:
    ports: !reset []
    environment:
      Jwt__Secret: *jwt-secret
      Services__InternalKey: *internal-key

  ai-service:
    ports: !reset []
    environment:
      APP_DOCS_ENABLED: "false"
      JWT_SECRET: *jwt-secret
      MYSQL_PASSWORD: *analytics-db-password

  prometheus:
    ports: !reset []

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD chưa đặt trong .env/môi trường (xem .env.example)}
