# Vai trò máy B (AZ thứ hai) trong chế độ HA. Dùng sau docker-compose.ha.yml (xem hướng dẫn ở đầu file đó).
# Máy B chỉ chạy tầng ứng dụng không giữ trạng thái. RabbitMQ nằm ở máy A: đặt RABBITMQ_HOST=<IP private của máy A> trong .env.
# Không chạy ở máy B (profile ha-a-only, không bao giờ được bật): RabbitMQ, Mongo, mailpit, relay outbox, scheduler,
# chat, notification. Relay outbox viết bằng .NET (purchase, inventory) nằm trong chính process dịch vụ nên tắt bằng
# Outbox__RelayEnabled=false.

services:
  rabbitmq:
    profiles: ["ha-a-only"]
  mongo:
    profiles: ["ha-a-only"]
  mailpit:
    profiles: ["ha-a-only"]
  catalog-relay:
    profiles: ["ha-a-only"]
  sales-relay:
    profiles: ["ha-a-only"]
  sales-scheduler:
    profiles: ["ha-a-only"]
  eoffice-relay:
    profiles: ["ha-a-only"]
  chat-service:
    profiles: ["ha-a-only"]
  notification-service:
    profiles: ["ha-a-only"]

  # Giám sát phía máy B chỉ gồm Alloy (không Loki, Prometheus, Grafana): đẩy log về Loki ở máy A.
  # profiles rỗng để Alloy chạy mà không cần COMPOSE_PROFILES=monitoring. LOKI_HOST mặc định là địa chỉ máy A (cùng RABBITMQ_HOST).
  alloy:
    profiles: !override []
    depends_on: !override {}
    environment:
      LOKI_PUSH_URL: http://${LOKI_HOST:-${RABBITMQ_HOST}}:3100/loki/api/v1/push

  purchase-service:
    environment:
      Outbox__RelayEnabled: "false"
    depends_on: !override {}
  inventory-service:
    environment:
      Outbox__RelayEnabled: "false"
    depends_on: !override {}
  catalog-service:
    depends_on: !override {}
  eoffice-service:
    depends_on: !override {}
  sales-service:
    depends_on: !override {}

  # Gateway không có depends_on ở cả hai máy (đặt trong docker-compose.ha.yml): Kong chạy được khi thiếu chat,
  # notification và khi bất kỳ service nào đang tắt. Tuyến /api/v1/chat và /api/v1/notifications chỉ được ALB gửi vào máy A.
