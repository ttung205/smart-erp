events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    log_format microservices '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" correlation_id="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log microservices;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Dynamic UUID generation for Correlation ID if not provided by client
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # WebSocket: chỉ gửi Connection: upgrade khi client yêu cầu nâng cấp
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name localhost;

        # Add Correlation ID to all responses
        add_header X-Correlation-ID $correlation_id always;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-ID, Accept' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health Check
        location /health {
            return 200 '{"status":"UP","timestamp":"$time_iso8601","gateway":"Smart-ERP-Gateway"}';
        }

        # 1. Identity Service Route
        location /api/v1/auth/ {
            proxy_pass http://identity-service:8001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            # Khóa nội bộ chỉ dành cho service gọi trực tiếp nhau; client đi qua gateway không được tự gửi
            proxy_set_header X-Internal-Service-Key "";
        }

        # 2. Catalog Service Route
        location /api/v1/catalog/ {
            proxy_pass http://catalog-service:8002/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 3. Purchase Service Route
        location /api/v1/purchase/ {
            proxy_pass http://purchase-service:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 4. Inventory Service Route
        location /api/v1/inventory/ {
            proxy_pass http://inventory-service:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 5. Sales Service Route
        location /api/v1/sales/ {
            proxy_pass http://sales-service:8005/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 6. Notification Service Route (Email / SMS)
        location /api/v1/notifications/ {
            # Giữ nguyên prefix: notification-service định tuyến theo /api/v1/notifications/*
            proxy_pass http://notification-service:8006;
            # WebSocket cho Socket.IO (/api/v1/notifications/socket.io)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # Finance Service Route
        location /api/v1/finance/ {
            proxy_pass http://finance-service:8008/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 7. E-Office Service Route
        location /api/v1/eoffice/ {
            proxy_pass http://eoffice-service:8007/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # Chat Service Route (REST + SignalR WebSocket)
        location /api/v1/chat/ {
            # Giữ nguyên prefix: chat-service định tuyến theo /api/v1/chat/*
            proxy_pass http://chat-service:8009;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            # Tối đa 10 tệp x 20 MB mỗi tin nhắn
            client_max_body_size 210m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }

        # 8. AI & Analytics Service Route
        location /api/v1/ai/ {
            proxy_pass http://ai-service:8010;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Internal-Service-Key "";
        }
    }
}
