# Sau Application Load Balancer (chế độ HA), kết nối tới nginx đến từ ALB nên $remote_addr là IP của ALB. Tin X-Forwarded-For
# CHỈ khi kết nối đến từ dải VPC mặc định (172.31.0.0/16): khi đó $remote_addr được khôi phục thành IP người dùng thật.
# Kết nối từ nơi khác (dev, Caddy, Internet) không nằm trong dải này nên không giả mạo được IP bằng header.
set_real_ip_from 172.31.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    # Single Page Application router fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check cho ALB và Caddy: đi tới Kong, không cần xác thực
    location = /health {
        access_log off;
        proxy_pass http://gateway:8000/health;
    }

    # Proxy all API and WebSocket calls to Gateway
    location /api/ {
        # Khớp giới hạn của Kong (KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE=210m). Thiếu dòng này nginx mặc định chỉ nhận 1 MB
        # và chặn tệp đính kèm lớn hơn bằng lỗi 413 trước khi yêu cầu tới được Kong.
        client_max_body_size 210m;
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx là điểm vào duy nhất từ trình duyệt: ghi đè (không nối thêm) để client không tự đặt được IP của mình.
        # $remote_addr đã là IP người dùng thật kể cả sau ALB nhờ khối set_real_ip_from ở đầu file.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
